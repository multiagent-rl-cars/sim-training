# Use the same locked tools locally and in CI. Legacy Isaac code is migrated in
# tested slices; the owned checking scope is explicit in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (portable code)
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Ruff format (portable code)
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ty
        name: ty (portable code and tests)
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        types: [python]
